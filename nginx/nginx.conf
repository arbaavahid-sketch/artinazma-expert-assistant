# ─── ArtinAzma nginx reverse-proxy config ────────────────────────────────────
# Routes:
#   /api/*     → backend:8000  (path rewritten, strips /api prefix)
#   /          → frontend:3000 (Next.js)
#
# TLS certs must be present at:
#   /etc/nginx/certs/fullchain.pem
#   /etc/nginx/certs/privkey.pem
#
# For self-signed dev certs:   make certs-dev
# For Let's Encrypt prod certs: make certs-prod DOMAIN=yourdomain.com
# ─────────────────────────────────────────────────────────────────────────────

worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile            on;
    keepalive_timeout   65;
    client_max_body_size 30m;      # allow large knowledge-file uploads

    # Map HTTP Upgrade header → Connection header for WebSocket proxying
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── Gzip ──────────────────────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript;

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Let's Encrypt ACME challenge (certbot webroot)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS ─────────────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2  on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # Modern TLS — Mozilla "Intermediate" profile
        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout       1d;
        ssl_session_cache         shared:SSL:10m;
        ssl_session_tickets       off;

        # Security headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options    nosniff                                        always;
        add_header X-Frame-Options           DENY                                           always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
        add_header X-XSS-Protection          "1; mode=block"                                always;
        add_header Permissions-Policy        "camera=(), microphone=(self), geolocation=()" always;
        add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' wss:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self';" always;

        # Common proxy headers (inherited by all location blocks below)
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ── WebSocket upgrade: /api/ws/* ─────────────────────────────────────
        location /api/ws/ {
            rewrite ^/api/ws/(.*)$ /ws/$1 break;
            proxy_pass http://backend:8000;

            proxy_http_version 1.1;
            proxy_set_header Upgrade   $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── SSE streaming: /api/chat/stream ──────────────────────────────────
        location /api/chat/stream {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://backend:8000;

            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 300s;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";    # keep-alive for SSE
        }

        # ── All other backend API calls: /api/* ───────────────────────────────
        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://backend:8000;

            proxy_read_timeout    120s;
            proxy_connect_timeout  10s;
        }

        # ── Frontend (Next.js) — everything else ─────────────────────────────
        location / {
            proxy_pass http://frontend:3000;

            # Next.js HMR in dev uses WebSocket
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_read_timeout 60s;
        }
    }
}
