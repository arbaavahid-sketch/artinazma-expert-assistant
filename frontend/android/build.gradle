// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {

    repositories {
        // Iranian mirrors for Maven Google / Maven Central (Iran-friendly).
        // These are tried first; google()/mavenCentral() remain as fallbacks
        // for use with a VPN.
        maven { url 'https://maven.myket.ir' }
        maven { url 'https://maven.parspack.com/repository/maven-public/' }
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.12.3'
        classpath 'com.google.gms:google-services:4.4.3'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        // Iranian mirrors first (works without VPN), then official sources.
        maven { url 'https://maven.myket.ir' }
        maven { url 'https://maven.parspack.com/repository/maven-public/' }
        google()
        mavenCentral()
    }
}

// Force every Android subproject (incl. capacitor-* from node_modules) to use
// Build Tools 36.1.0 — AGP's default (35.0.0) isn't installed and downloading
// it from Iran is blocked.
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                buildToolsVersion = "36.1.0"
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
