<!doctype html>

    <title>Artin</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #1d4ed8;
        color: #fff;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        display: grid;
        gap: 14px;
        place-items: center;

        border-radius: 28px;
        box-shadow: 0 18px 45px rgba(15, 23, 42, 0.24);
      }
      h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 900;
      }
      p {
        margin: 0;
        opacity: 0.78;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="./pwa-192.png" alt="" />

      <p>در حال آماده سازی...</p>
    </main>
