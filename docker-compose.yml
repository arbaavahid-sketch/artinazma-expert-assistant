version: "3.9"

# ─── Required environment variables ──────────────────────────────────────────
# Copy .env.example → .env and fill in:
#   POSTGRES_PASSWORD   strong database password
#   DOMAIN              your public domain (e.g. artinazma.net)
#                       defaults to "localhost" for local dev
#
# For production TLS certs:  make certs-prod DOMAIN=yourdomain.com
# For self-signed dev certs: make certs-dev   (already included in repo)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: artin_postgres
    environment:
      POSTGRES_DB: artinazma
      POSTGRES_USER: artinazma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artinazma -d artinazma"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: artin_redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save ""
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Qdrant ──────────────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: artin_qdrant
    # Not exposed externally — backend accesses via internal Docker network
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 20s
      timeout: 5s
      retries: 3

  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: artin_backend
    # Port 8000 is NOT exposed externally — nginx is the sole public entry point
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://artinazma:${POSTGRES_PASSWORD}@postgres:5432/artinazma
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - backend_storage:/app/storage
      - backend_uploads:/app/uploads
      - backend_knowledge:/app/knowledge_files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Next.js Frontend ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the Next.js bundle at build time.
        # Browser calls   → https://<DOMAIN>/api/* → nginx → backend:8000
        # SSR calls (Node) are also routed via nginx for consistency.
        - NEXT_PUBLIC_API_BASE_URL=https://${DOMAIN:-localhost}/api
        - NEXT_PUBLIC_WS_BASE_URL=wss://${DOMAIN:-localhost}/api
    container_name: artin_frontend
    # Port 3000 is NOT exposed externally — nginx proxies all traffic
    environment:
      - NEXT_PUBLIC_API_BASE_URL=https://${DOMAIN:-localhost}/api
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── nginx reverse proxy + TLS termination ────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: artin_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      # Certbot webroot for ACME HTTP-01 challenges (production)
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Certbot (Let's Encrypt) — runs once to issue/renew certs ─────────────────
  # Activated manually for production:  docker compose run --rm certbot
  # Or scheduled renewal:               docker compose run --rm certbot renew
  certbot:
    image: certbot/certbot:latest
    container_name: artin_certbot
    profiles:
      - certbot          # only starts when explicitly requested
    volumes:
      - ./nginx/certs:/etc/letsencrypt/live/${DOMAIN:-localhost}
      - certbot_webroot:/var/www/certbot
    command: >
      certonly --webroot
      --webroot-path=/var/www/certbot
      --email ${CERTBOT_EMAIL:-admin@example.com}
      --agree-tos --no-eff-email
      -d ${DOMAIN:-localhost}
    restart: "no"

  # ── Prometheus ──────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: artin_prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - backend
    restart: unless-stopped
    # Prometheus UI is internal only — not exposed publicly
    # Access via: docker exec -it artin_prometheus sh  or  ssh tunnel

  # ── Grafana ──────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.1.0
    container_name: artin_grafana
    ports:
      - "127.0.0.1:3001:3000"   # localhost only — forward via SSH tunnel for access
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-artinazma_grafana}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/grafana
      - GF_LOG_LEVEL=warn
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped

  # Backup service (run manually with: docker compose --profile backup run --rm backup)
  # Runs pg_dump + Qdrant snapshot, keeps 7 days of history.
  # Backups are stored in the backup_data volume (docker managed).
  backup:
    image: postgres:16-alpine
    container_name: artin_backup
    profiles:
      - backup
    environment:
      - DATABASE_URL=postgresql://artinazma:${POSTGRES_PASSWORD}@postgres:5432/artinazma
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=knowledge
      - BACKUP_DIR=/backups
      - KEEP_DAYS=7
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - backup_data:/backups
    depends_on:
      postgres:
        condition: service_healthy
    command: sh /backup.sh
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  backend_storage:
  backend_uploads:
  backend_knowledge:
  qdrant_data:
  certbot_webroot:
  prometheus_data:
  grafana_data:
  backup_data:
