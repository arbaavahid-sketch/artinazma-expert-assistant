name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Backend ───────────────────────────────────────────────────────────────────
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install ruff (fast Python linter)
        run: pip install ruff

      - name: Lint (ruff)
        run: ruff check . --select E,F,W --ignore E501 --exclude venv,alembic

      - name: Syntax check (all .py files)
        run: |
          python - << 'PYEOF'
          import ast, os, sys
          errors = []
          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in ("venv", "__pycache__", ".git", "alembic")]
              for f in files:
                  if f.endswith(".py"):
                      path = os.path.join(root, f)
                      with open(path, "rb") as fh:
                          src = fh.read()
                      try:
                          ast.parse(src)
                      except SyntaxError as e:
                          errors.append(f"{path}:{e.lineno}: {e.msg}")
          if errors:
              print("SYNTAX ERRORS:")
              for e in errors:
                  print(e)
              sys.exit(1)
          print(f"All Python files: OK")
          PYEOF

      - name: Run tests
        run: python -m pytest tests/ -q --tb=short
        env:
          OPENAI_API_KEY: sk-test-dummy-key
          ADMIN_API_KEY: test-admin-key
          JWT_SECRET: test-jwt-secret

      - name: Dependency vulnerability scan (pip-audit)
        # Informational — does not fail the build yet. Review findings in the log.
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --desc

  # ── Frontend ──────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (typecheck + lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency vulnerability scan (npm audit)
        # Informational — does not fail the build yet. Review findings in the log.
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm test

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://artinazma.net/api
          NEXT_PUBLIC_WS_BASE_URL: wss://artinazma.net/api

  # ── Docker build check ────────────────────────────────────────────────────────
  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]   # only build if tests pass

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t artinazma-backend ./backend

      - name: Build frontend image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_BASE_URL=https://artinazma.net/api \
            --build-arg NEXT_PUBLIC_WS_BASE_URL=wss://artinazma.net/api \
            -t artinazma-frontend ./frontend
